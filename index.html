<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Liga Match Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div id="app" class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6">ეროვნული ლიგა</h1>
        <div class="bg-white p-6 rounded-2xl shadow-lg text-center">
            <h2 class="text-xl font-semibold mb-4">მიმდინარე მატჩი</h2>
            <div class="flex justify-between text-4xl font-bold mb-8">
                <span>0</span>
                <span>-</span>
                <span>0</span>
            </div>
            <button class="w-full bg-pink-500 text-white py-4 rounded-xl font-bold text-lg">+ New Match</button>
        </div>
    </div>
</body>
</html>
