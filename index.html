<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Liga Match Tracer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .bg-magenta { background-color: #e6007e; }
        .text-magenta { color: #e6007e; }
        .border-magenta { border-color: #e6007e; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900" x-data="matchApp()" x-init="init()">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative overflow-hidden flex flex-col">
        
        <div x-show="view === 'home'" class="flex flex-col items-center justify-center h-screen p-8 text-center space-y-8">
            <h1 class="text-4xl font-black text-gray-800 uppercase">ეროვნული ლიგა</h1>
            <div class="w-full space-y-4">
                <button @click="view = 'setup'" class="w-full bg-magenta text-white py-5 rounded-2xl font-bold text-xl">+ New Match</button>
                <button @click="view = 'history'" class="w-full border-2 border-gray-800 py-5 rounded-2xl font-bold text-xl">History</button>
            </div>
        </div>

        <div x-show="view === 'setup'" x-cloak class="p-6 space-y-6 overflow-y-auto h-screen">
            <div class="flex items-center space-x-4">
                <button @click="view = 'home'" class="p-2"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 class="text-2xl font-bold">Match Setup</h2>
            </div>
            <input type="text" x-model="setup.homeName" placeholder="Home" class="w-full p-3 bg-gray-50 rounded-xl">
            <input type="text" x-model="setup.awayName" placeholder="Away" class="w-full p-3 bg-gray-50 rounded-xl">
            <button @click="startMatch()" class="w-full bg-magenta text-white py-5 rounded-2xl font-bold">Start Match</button>
        </div>

        <div x-show="view === 'live'" x-cloak class="flex flex-col h-screen overflow-hidden">
            <div class="p-6 bg-gray-800 text-white text-center">
                <div class="flex items-center justify-between">
                    <div class="flex-1 cursor-pointer" @click="match.scoreHome = prompt('Edit Home Score', match.scoreHome)">
                        <p class="text-xs opacity-50" x-text="match.homeName"></p>
                        <p class="text-5xl font-black" x-text="match.scoreHome"></p>
                    </div>
                    <div class="px-4">
                        <p class="text-2xl font-mono bg-black bg-opacity-30 px-3 py-1 rounded-lg mb-2 cursor-pointer" 
                           @click="let t = prompt('Edit Time (seconds)', match.timer); if(t) match.timer = parseInt(t)" 
                           x-text="formatTime(match.timer)"></p>
                        <button @click="toggleTimer()" class="text-magenta text-2xl">
                            <i :class="match.isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause'"></i>
                        </button>
                    </div>
                    <div class="flex-1 cursor-pointer" @click="match.scoreAway = prompt('Edit Away Score', match.scoreAway)">
                        <p class="text-xs opacity-50" x-text="match.awayName"></p>
                        <p class="text-5xl font-black" x-text="match.scoreAway"></p>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-2">
                <template x-for="(ev, index) in match.events">
                    <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-xl border-l-4" :class="ev.team === 'home' ? 'border-magenta' : 'border-gray-800'">
                        <span class="font-mono text-xs font-bold underline cursor-pointer" 
                              @click="ev.time = prompt('Edit Time', ev.time)" x-text="ev.time"></span>
                        <div class="flex-1 text-sm"><span class="font-bold uppercase" x-text="ev.type"></span></div>
                        <button @click="match.events.splice(index, 1)" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function matchApp() {
            return {
                view: 'home',
                setup: { homeName: 'Gagra', awayName: 'Dila', homePlayers: [], awayPlayers: [], playerStatus: 'starting' },
                match: { homeName: '', awayName: '', scoreHome: 0, scoreAway: 0, events: [], timer: 0, isPaused: true, timerInterval: null },
                
                toggleTimer() {
                    this.match.isPaused = !this.match.isPaused;
                    if (!this.match.isPaused) {
                        this.match.timerInterval = setInterval(() => {
                            this.match.timer++;
                            // ავტომატური პაუზა 45-ე წუთზე
                            if (this.match.timer >= 2700) {
                                this.match.isPaused = true;
                                clearInterval(this.match.timerInterval);
                                alert('1st Half Finished!');
                            }
                        }, 1000);
                    } else { clearInterval(this.match.timerInterval); }
                },
                formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; },
                // ... [დარჩენილი ფუნქციები უცვლელი]
                startMatch() { this.match.homeName = this.setup.homeName; this.match.awayName = this.setup.awayName; this.view = 'live'; }
            }
        }
    </script>
</body>
</html>
